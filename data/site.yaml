about:

  tag: "About"

  heading: "Who am I?"

  # Source: LinkedIn profile (About, Experience, Education), October 2026

  description: >
    I am a Clinical Psychologist licensed by the Dubai Health Authority,
    offering online therapy to clients in India and the UAE. I live in
    Vienna and have experience across neurology, psychiatry and
    organisational mental health.

  bio:

    - >
      Born in India and raised in Abu Dhabi, my professional training
      and practice span India, the UK, Greece, the UAE and the USA. This
      international background allows me to work effectively with
      diverse populations and multinational teams.

    - >
      Alongside clinical practice, I have worked with corporate and
      organisational clients, supporting employee mental health,
      leadership development, resilience and psychological wellbeing
      in the workplace. In both individual and organisational work,
      my approach is evidence-based and culturally sensitive.

