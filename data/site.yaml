  regions: "India and the UAE"

  licences:

    - name: "Dubai Health Authority (DHA), United Arab Emirates"
      country: "United Arab Emirates"
      number: ""   # TODO: add DHA licence number

    # Shown only once a registration number is filled in. Do not publish
    # India as a client region without a valid RCI registration.
    - name: "Rehabilitation Council of India (RCI)"
      country: "India"
      number: ""   # TODO: add RCI Central Rehabilitation Register (CRR) number
      require_number: true

  notice: >
    Sessions are offered online only, to clients who are located in India
